apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-app-backend
  namespace: aks-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: aks-app-backend

  template:
    metadata:
      labels:
        app: aks-app-backend

    spec:
      containers:
        - name: backend
          image: ghcr.io/manish7830/aks-app-backend:v4
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3